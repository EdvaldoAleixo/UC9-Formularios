<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa</title>
</head>

<body>

    <h1>Pesquisa de Usuário</h1>

    <form action="" method="get">

        <fieldset>

            <label for="nomeUsuario">Nome do Usuário:</label>
            <input type="text" name="nomeUsuario" id="nomeUsuarioId" required><br>
            
            <label for="idadeUsuario">Idade do Usuário:</label>
            <input type="number" name="idadeUsuario" id="idadeUsuarioId" min="18" max="120"><br>

            <label for="dtNascimento">Data de Nascimento:</label>
            <input type="date" name="dtNascimento" id="dtNascimentoId">

        </fieldset><br>

        <button type="submit">Enviar Dados</button>
        <button type="reset">Limpar</button>

    </form>


</body>

</html>
